name: vendor-sync-check

# Implements: P-MUST-09

# Fails the build if any file under vendor/ is missing a valid sync header.
# Vendored content is synced copy, never the source of truth: the header is
# the contract that records the true canonical upstream and source commit.
# Also checks the hygiene unit suite, Python and shell syntax, eval JSON, and
# feature-authored text constraints.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  vendor-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Lint shell scripts (syntax only)
        run: sh -n scripts/sync-upstream && sh -n scripts/check-vendor-headers && sh -n scripts/check-upstream-freshness

      - name: Validate that evals.json parses
        run: python3 -c "import json; json.load(open('evals/evals.json'))"

      - name: Run text hygiene unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check text hygiene Python syntax
        run: python3 -m py_compile scripts/text_hygiene.py tests/test_text_hygiene.py

      - name: Reject disallowed Unicode dashes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/text_hygiene.py"),
              Path("tests/test_text_hygiene.py"),
              Path("SKILL.md"),
              Path("AGENTS.md"),
              Path("GEMINI.md"),
              Path(".cursor/rules/voiceprint.mdc"),
              Path(".github/copilot-instructions.md"),
              Path("evals/evals.json"),
              Path("README.md"),
              Path("CHANGELOG.md"),
              Path(".github/workflows/vendor-sync-check.yml"),
          ]
          forbidden = {chr(0x2013): "U+2013", chr(0x2014): "U+2014"}
          failures = []
          for path in paths:
              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  for character, label in forbidden.items():
                      if character in line:
                          failures.append(f"{path}:{line_number}: contains {label}")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Validate vendored sync headers
        run: sh scripts/check-vendor-headers

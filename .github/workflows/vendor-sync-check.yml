name: vendor-sync-check

# Fails the build if any file under vendor/ is missing a valid sync header.
# Vendored content is synced copy, never the source of truth: the header is
# the contract that records the true canonical upstream and source commit.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  vendor-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate vendored sync headers
        run: sh scripts/check-vendor-headers
